[webservers]
web-server ansible_host=10.0.0.5

[ansible_controller]
ansible-controller ansible_host=10.0.0.135

[monitoring]
monitoring-server ansible_host=10.0.0.136

[all:vars]
ansible_connection=ssh
ansible_user=ubuntu
ansible_ssh_private_key_file=/home/ssm-user/.ssh/ansible_controller_ed25519
ansible_ssh_common_args='-o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'